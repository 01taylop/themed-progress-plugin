name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check Node types
        run: |
          node -e '
            const { devDependencies, engines } = require("./package.json")
            const [minimum, types] = [engines.node, devDependencies["@types/node"]].map(version => version.match(/\d+/)[0])
            if (minimum !== types) throw new Error(`@types/node v${types} does not match the minimum Node version v${minimum}`)
          '

      - name: Type check
        run: yarn tsc --noEmit

      - name: Check code quality
        run: yarn knip

      - name: Unit tests
        run: yarn test --coverage

      - name: Build
        run: yarn build

      - name: Check package types
        run: yarn attw --pack .

      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lib
          path: lib/
          retention-days: 1

  integration:
    name: Integration (${{ matrix.node-version }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.18, 20.x, 22.x, 24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: |
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ]; then
            npm install --global corepack@0.36.0
          fi
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download build
        uses: actions/download-artifact@v8.0.2
        with:
          name: lib
          path: lib/

      - name: Integration tests
        run: yarn test:integration
